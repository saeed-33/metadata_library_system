services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LibrarySystem@12345}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15

  logging-api:
    build:
      context: .
      dockerfile: Logging.API/Dockerfile
    container_name: library-logging-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LibrarySystem_LoggingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LibrarySystem@12345};TrustServerCertificate=True;"
    ports:
      - "5113:8080"

  library-api:
    build:
      context: .
      dockerfile: LibrarySystem.API/Dockerfile
    container_name: library-api
    depends_on:
      sqlserver:
        condition: service_healthy
      logging-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LibrarySystem_Db;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LibrarySystem@12345};TrustServerCertificate=True;"
      ConnectionStrings__IdentityConnection: "Server=sqlserver,1433;Database=LibrarySystem_IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LibrarySystem@12345};TrustServerCertificate=True;"
      LoggingService__BaseUrl: "http://logging-api:8080"
    ports:
      - "5112:8080"

volumes:
  sqlserver-data:
